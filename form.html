<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir Pesanan – Toko Mini</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <nav class="nav" aria-label="Navigasi utama">
    <a href="index.html">Etalase</a>
    <a href="form.html" aria-current="page">Pesan</a>
  </nav>

  <header class="site-header">
    <h1>Formulir pesanan</h1>
    <p>Isi data pesananmu. Pesan error dan hasil tampil langsung di halaman.</p>
  </header>

  <main>
    <section id="pesan" aria-labelledby="judul-form">
      <h2 id="judul-form">Data pesanan</h2>
      <form id="form-pesanan" novalidate>
        <div class="field">
          <label for="nama">Nama lengkap</label>
          <input type="text" id="nama" name="nama" autocomplete="name">
          <small class="error" id="err-nama"></small>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <small class="error" id="err-email"></small>
        </div>

        <div class="field">
          <label for="produk-dipilih">Produk</label>
          <input type="text" id="produk-dipilih" name="produk" placeholder="Klik “Pesan” pada produk atau ketik manual">
          <small class="error" id="err-produk"></small>
        </div>

        <div class="field">
          <label for="jumlah">Jumlah</label>
          <input type="number" id="jumlah" name="jumlah" min="1" max="99" value="1">
          <small class="error" id="err-jumlah"></small>
        </div>

        <div class="field">
          <label for="catatan">Catatan (opsional)</label>
          <textarea id="catatan" name="catatan" rows="3" maxlength="120"></textarea>
          <small id="hitung">0 / 120 karakter</small>
        </div>

        <div class="actions">
          <button type="submit">Kirim pesanan</button>
          <button type="reset" class="ghost">Reset</button>
        </div>
      </form>

      <div id="hasil" class="hasil" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <footer>Tugas PPAW Week 6 · JavaScript DOM, Event Handling, Fetch API</footer>

  <script src="js/form.js"></script>
</body>
</html>
